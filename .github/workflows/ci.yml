name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded PR runs are cancelled, but runs on main never are: a merge that
# lands mid-deploy must not cancel the previous deploy halfway through.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  # On main: skip re-running the checks when the merged tree is exactly the
  # tree of a PR head that already passed them. main only accepts PRs that
  # are up to date and green, so this is the same code; anything else (no
  # PR, different tree, check not green) runs the full checks.
  verify-merge:
    name: Verify merge was tested
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tested: ${{ steps.tree.outputs.tested }}
    steps:
      - uses: actions/checkout@v4
      - id: tree
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tested=false
          head=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].head.sha // empty')
          if [ -n "$head" ]; then
            ok=$(gh api "repos/$REPO/commits/$head/check-runs?check_name=Lint,%20Typecheck%20%26%20Build" \
              --jq '[.check_runs[] | select(.conclusion == "success")] | length')
            git fetch --quiet --depth=1 origin "$head"
            if [ "${ok:-0}" -gt 0 ] && [ "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$head^{tree}")" ]; then
              tested=true
            fi
          fi
          echo "PR head: ${head:-none}; tested: $tested"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

  checks:
    name: ${{ matrix.check.name }}
    needs: verify-merge
    if: always() && needs.verify-merge.outputs.tested != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        check:
          - { name: Lint, run: npm run lint }
          - { name: Typecheck, run: npm run typecheck }
          - { name: Test (1/2), run: npx vitest run --shard=1/2 }
          - { name: Test (2/2), run: npx vitest run --shard=2/2 }
          - { name: Build, run: SKIP_ENV_VALIDATION=1 npm run build }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Next.js build cache
        if: matrix.check.name == 'Build'
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.mjs', 'tailwind.config.ts') }}
          restore-keys: nextjs-${{ hashFiles('package-lock.json') }}-

      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.run }}

  # The required status check for main. It passes only when every check
  # passed, or (on main) when the merge was verified as already tested.
  quality:
    name: Lint, Typecheck & Build
    needs: [verify-merge, checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Result
        env:
          TESTED: ${{ needs.verify-merge.outputs.tested }}
          CHECKS: ${{ needs.checks.result }}
        run: |
          echo "verified merge: ${TESTED:-n/a}; checks: $CHECKS"
          if [ "$TESTED" = "true" ] || [ "$CHECKS" = "success" ]; then exit 0; fi
          exit 1

  # Merges to main deploy to production, but only after the checks above
  # pass: Firestore rules + indexes (App Hosting doesn't deploy those),
  # pending data migrations, then an App Hosting rollout of the exact commit
  # that was tested. Keep App
  # Hosting's own "automatic rollouts" off so untested code never ships.
  deploy:
    name: Deploy to production
    needs: quality
    if: always() && needs.quality.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Never cancel a deploy halfway; queue the next one instead.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      FIREBASE_PROJECT: cricscore-prod-7411
      APPHOSTING_BACKEND: cricscore
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        id: auth
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_PROD secret is not set; skipping the production deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}

      - name: Deploy Firestore rules and indexes
        if: steps.auth.outputs.ready == 'true'
        run: npx firebase deploy --only firestore --project "$FIREBASE_PROJECT" --non-interactive

      # Pending data migrations (scripts/migrate.mjs keeps a ledger in
      # Firestore, so each runs once). A failure stops the deploy before the
      # new app version goes live.
      - name: Run pending data migrations
        if: steps.auth.outputs.ready == 'true'
        run: node scripts/migrate.mjs --project="$FIREBASE_PROJECT"
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}

      - name: Roll out App Hosting
        if: steps.auth.outputs.ready == 'true'
        run: >
          npx firebase apphosting:rollouts:create "$APPHOSTING_BACKEND"
          --git-commit "$GITHUB_SHA" --force
          --project "$FIREBASE_PROJECT" --non-interactive

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-key.json"
