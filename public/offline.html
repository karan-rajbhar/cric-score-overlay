<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafd" />
    <title>Offline · CricScore</title>
    <link rel="icon" href="/favicon.ico" />
    <script>
      // The theme chosen in the app, as its pages paint it (N33).
      (function () {
        try {
          var t = localStorage.getItem("cricket-ui-theme") || "light";
          var d = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.className = d ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        --bg: hsl(230 40% 98.5%);
        --card: hsl(0 0% 100%);
        --fg: hsl(236 45% 12%);
        --muted: hsl(233 12% 44%);
        --ring: hsl(230 25% 91%);
        --primary: hsl(241 50% 27%);
        --primary-fg: #ffffff;
        color-scheme: light;
      }
      :root.dark {
        --bg: hsl(235 38% 7%);
        --card: hsl(235 30% 11%);
        --fg: hsl(230 40% 95%);
        --muted: hsl(232 16% 68%);
        --ring: hsl(235 22% 19%);
        --primary: hsl(238 90% 82%);
        --primary-fg: hsl(241 55% 14%);
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }
      /* The app's floating card: no border, 16px corners, a hairline ring. */
      main {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border-radius: 16px;
        box-shadow: 0 0 0 1px var(--ring), 0 1px 2px hsl(236 45% 12% / 0.04), 0 4px 16px hsl(236 45% 12% / 0.05);
        padding: 24px;
      }
      h1 { margin: 0 0 8px; font-size: 1.25rem; font-weight: 600; text-wrap: balance; }
      p { margin: 0 0 16px; color: var(--muted); font-size: 0.95rem; }
      h2 { margin: 20px 0 4px; font-size: 1rem; font-weight: 600; }
      ul { list-style: none; margin: 0 0 20px; padding: 0; }
      li + li { margin-top: 8px; }
      a.match {
        display: flex;
        align-items: center;
        min-height: 44px;
        padding: 10px 14px;
        border-radius: 12px;
        box-shadow: 0 0 0 1px var(--ring);
        color: var(--fg);
        text-decoration: none;
        font-weight: 500;
      }
      a.match:focus-visible, button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
      /* The app's primary button: a pill, 44px to tap. */
      button {
        appearance: none;
        border: 0;
        border-radius: 9999px;
        min-height: 44px;
        padding: 10px 20px;
        background: var(--primary);
        color: var(--primary-fg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>This page needs a connection. It opens again when you're back online.</p>
      <!-- For scorers, and only when there is something to open (N33). -->
      <section id="matches" hidden aria-labelledby="matches-title">
        <h2 id="matches-title">Scoring on this device</h2>
        <p>These matches open offline. Balls you score sync when you're back online.</p>
        <ul id="match-list"></ul>
      </section>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      (async function () {
        var list = document.getElementById("match-list");
        var found = 0;
        function label(id) {
          try {
            var raw = localStorage.getItem("cric_match_cache_" + id);
            var m = raw && JSON.parse(raw).match;
            var a = m && (m.team1 || m.team1_snapshot);
            var b = m && (m.team2 || m.team2_snapshot);
            if (a && b) return (a.short_name || a.name) + " v " + (b.short_name || b.name);
          } catch (e) {}
          return "Match " + id.slice(0, 8);
        }
        try {
          var names = await caches.keys();
          for (var i = 0; i < names.length; i++) {
            if (names[i].indexOf("cricscore-pages-") !== 0) continue;
            var cache = await caches.open(names[i]);
            var keys = await cache.keys();
            for (var j = 0; j < keys.length; j++) {
              var path = new URL(keys[j].url).pathname;
              var m = path.match(/^\/matches\/([^/]+)\/score$/);
              if (!m) continue;
              var li = document.createElement("li");
              var a = document.createElement("a");
              a.className = "match";
              a.href = path;
              a.textContent = label(decodeURIComponent(m[1]));
              li.appendChild(a);
              list.appendChild(li);
              found++;
            }
          }
        } catch (e) {}
        if (found) document.getElementById("matches").hidden = false;
      })();
      addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
