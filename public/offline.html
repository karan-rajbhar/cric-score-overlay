<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7f6" />
    <title>Offline · CricScore</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        --bg: hsl(150 12% 96.5%);
        --card: hsl(0 0% 100%);
        --fg: hsl(160 28% 10%);
        --muted: hsl(160 7% 36%);
        --border: hsl(150 9% 87%);
        --primary: hsl(155 58% 26%);
        --primary-fg: #ffffff;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: hsl(160 22% 6%);
          --card: hsl(160 18% 9%);
          --fg: hsl(80 15% 94%);
          --muted: hsl(150 8% 64%);
          --border: hsl(160 12% 17%);
          --primary: hsl(150 50% 48%);
          --primary-fg: hsl(160 22% 6%);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      }
      main {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
      }
      h1 { margin: 0 0 8px; font-size: 1.25rem; font-weight: 600; text-wrap: balance; }
      p { margin: 0 0 16px; color: var(--muted); font-size: 0.95rem; }
      h2 { margin: 20px 0 8px; font-size: 0.9rem; font-weight: 600; }
      ul { list-style: none; margin: 0; padding: 0; }
      li + li { margin-top: 8px; }
      a.match {
        display: block;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--fg);
        text-decoration: none;
        font-weight: 500;
      }
      a.match:focus-visible, button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
      button {
        appearance: none;
        border: 0;
        border-radius: 8px;
        padding: 10px 16px;
        background: var(--primary);
        color: var(--primary-fg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Open a match you've scored before on this device. Balls you score offline sync when you're back online.</p>
      <section id="matches" hidden aria-labelledby="matches-title">
        <h2 id="matches-title">Available offline</h2>
        <ul id="match-list"></ul>
      </section>
      <p id="empty" hidden>No matches are saved on this device yet. Open a match's scoring screen while online to keep it available offline.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      (async function () {
        var list = document.getElementById("match-list");
        var found = 0;
        function label(id) {
          try {
            var raw = localStorage.getItem("cric_match_cache_" + id);
            var m = raw && JSON.parse(raw).match;
            var a = m && (m.team1 || m.team1_snapshot);
            var b = m && (m.team2 || m.team2_snapshot);
            if (a && b) return (a.short_name || a.name) + " v " + (b.short_name || b.name);
          } catch (e) {}
          return "Match " + id.slice(0, 8);
        }
        try {
          var names = await caches.keys();
          for (var i = 0; i < names.length; i++) {
            if (names[i].indexOf("cricscore-pages-") !== 0) continue;
            var cache = await caches.open(names[i]);
            var keys = await cache.keys();
            for (var j = 0; j < keys.length; j++) {
              var path = new URL(keys[j].url).pathname;
              var m = path.match(/^\/matches\/([^/]+)\/score$/);
              if (!m) continue;
              var li = document.createElement("li");
              var a = document.createElement("a");
              a.className = "match";
              a.href = path;
              a.textContent = label(decodeURIComponent(m[1]));
              li.appendChild(a);
              list.appendChild(li);
              found++;
            }
          }
        } catch (e) {}
        document.getElementById(found ? "matches" : "empty").hidden = false;
      })();
      addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
